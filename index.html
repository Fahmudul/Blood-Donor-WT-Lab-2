<!DOCTYPE html>
<html>

<head>
  <title>Blood Donor Registration</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: rgb(255, 245, 245);
    }

    .header {
      text-align: center;
    }

    .container {
      padding: 10px;
      border: 1px solid;
      max-width: 90%;
      width: 70%;
      margin: 0 auto;

    }

    #regForm {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-group {
      display: flex;
      gap: 10px;
    }

    #list {
      width: 90%;
      margin: 10px auto;
      border: 1px sold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="header">Blood Donor Registration</h1>
    <div class="form-container">
      <form id="regForm" novalidate onsubmit="return validateForm()">

        <div class="form-group">
          Full Name <input type="text" id="fname" name="fname" required minlength="3">
          <div id="err-fname" class="error"></div>
        </div>

        <div class="form-group">
          AIUB ID <input type="text" id="sid" name="sid" required pattern="[0-9]{2}-[0-9]{5}-[0-9]"
            placeholder="22-12345-1">
          <div id="err-sid" class="error"></div>
        </div>

        <div class="form-group">
          Mobile <input type="text" id="phone" name="phone" required pattern="[0-9]{11}" placeholder="01XXXXXXXXX">
          <div id="err-phone" class="error"></div>
        </div>


        <div class="form-group">
          Age <input type="number" id="age" name="age" required min="18" max="60">
          <div id="err-age" class="error"></div>
        </div>

        <div class="form-group">
          Blood Group
          <select id="bgroup" name="bgroup" required>
            <option value="">Select blood group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
          </select>
          <div id="err-bgroup" class="error"></div>
        </div>


        <div class="form-group">
          Donated Before
          <div class="radio-group">
            <input type="radio" id="donated-yes" name="donated" value="Yes" required>
            Yes
            <input type="radio" id="donated-no" name="donated" value="No" required>
            No
          </div>
          <div id="err-donated" class="error"></div>
        </div>


        <div class="form-group">
          <input type="checkbox" id="agree" name="agree" required>
          I am healthy and willing to donate
          <div id="err-agree" class="error"></div>
        </div>

        <div class="form-group">
          Password <input type="password" id="pass" name="pass" required minlength="6">
          <div id="err-pass" class="error"></div>
        </div>

        <div class="form-group">
          Confirm Password<input type="password" id="pass2" name="pass2" required>
          <div id="err-pass2" class="error"></div>
        </div>

        <button type="submit">Register Donor</button>

      </form>

      <p id="count">Total donors: 0</p>

    </div>

  </div>
  <table id="list">
    <thead>
      <tr>
        <th>Name</th>
        <th>ID</th>
        <th>Blood Group</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
    </tbody>
  </table>

  <script>
    let fname = document.getElementById("fname").value;
    let sid = document.getElementById("sid").value;
    let phone = document.getElementById("phone").value;
    let age = document.getElementById("age").value;
    let bgroup = document.getElementById("bgroup").value;
    let donated = document.querySelector('input[name="donated"]:checked')?.value;
    let agree = document.getElementById("agree").checked;
    let pass = document.getElementById("pass").value;
    let pass2 = document.getElementById("pass2").value;


    let donors = [];

    function validateForm() {
      let fname = document.getElementById("fname").value.trim();
      let sid = document.getElementById("sid").value;
      let phone = document.getElementById("phone").value;
      let age = document.getElementById("age").value;
      let bgroup = document.getElementById("bgroup").value;
      let donated = document.querySelector('input[name="donated"]:checked')?.value;
      let agree = document.getElementById("agree").checked;
      let pass = document.getElementById("pass").value;
      let pass2 = document.getElementById("pass2").value;

      let valid = true;
      document.querySelectorAll(".error").forEach(function (error) {
        error.innerText = "";
        error.style.color = "red";
      });


      if (fname.length < 3) {
        document.getElementById("err-fname").innerText =
          "Name must have at least 3 characters";
        valid = false;
      }

      if (!/^[0-9]{2}-[0-9]{5}-[0-9]$/.test(sid)) {
        document.getElementById("err-sid").innerText =
          "Invalid AIUB ID";
        valid = false;
      }

      if (!/^[0-9]{11}$/.test(phone)) {
        document.getElementById("err-phone").innerText =
          "Mobile must be exactly 11 digits";
        valid = false;
      }

      if (age === "" || !Number.isInteger(Number(age)) ||
        Number(age) < 18 || Number(age) > 60) {
        document.getElementById("err-age").innerText =
          "Age must be between 18 and 60";
        valid = false;
      }

      if (bgroup === "") {
        document.getElementById("err-bgroup").innerText =
          "Select a blood group";
        valid = false;
      }

      if (!donated) {
        document.getElementById("err-donated").innerText =
          "Choose Yes or No";
        valid = false;
      }

      if (!agree) {
        document.getElementById("err-agree").innerText =
          "You must tick the box";
        valid = false;
      }

      if (pass.length < 6) {
        document.getElementById("err-pass").innerText =
          "Password must have at least 6 characters";
        valid = false;
      }

      if (pass2 === "" || pass2 !== pass) {
        document.getElementById("err-pass2").innerText =
          "Passwords do not match";
        valid = false;
      }
      if (valid) {
        let donor = {
          name: fname,
          id: sid,
          group: bgroup
        };

        donors.push(donor);

        let tbody = document.querySelector("#list tbody");
        let row = document.createElement("tr");
        let nameCell = document.createElement("td");
        nameCell.innerText = donor.name;
        let idCell = document.createElement("td");
        idCell.innerText = donor.id;
        let groupCell = document.createElement("td");
        groupCell.innerText = donor.group;


        let actionCell = document.createElement("td");
        let removeBtn = document.createElement("button");
        removeBtn.innerText = "Remove";
        removeBtn.type = "button";

        removeBtn.onclick = function () {
          let index = donors.indexOf(donor);

          if (index !== -1) {
            donors.splice(index, 1);
          }

          row.remove();
          document.getElementById("count").innerText =
            "Total donors: " + donors.length;
        };

        actionCell.appendChild(removeBtn);
        row.appendChild(nameCell);
        row.appendChild(idCell);
        row.appendChild(groupCell);
        row.appendChild(actionCell);

        tbody.appendChild(row);

        document.getElementById("count").innerText =
          "Total donors: " + donors.length;

        document.getElementById("regForm").reset();
      }
      return false;
    }


  </script>
</body>

</html>
