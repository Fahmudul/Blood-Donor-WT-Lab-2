<!DOCTYPE html>
<html>

<head>
  <title>Blood Donor Registration</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: rgb(255, 245, 245);
    }

    .header {
      text-align: center;
    }

    .container {
      padding: 10px;
      border: 1px solid;
      max-width: 90%;
      width: 70%;
      margin: 0 auto;

    }

    #regForm {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .form-group {
      display: flex;
      gap: 10px;
    }

    #list {
      width: 90%;
      margin: 10px auto;
      border: 1px sold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1 class="header">Blood Donor Registration</h1>
    <div class="form-container">
      <form id="regForm" onsubmit="return validateForm()">

        <div class="form-group">
          Full Name <input type="text" id="fname" name="fname" required minlength="3">
          <div id="err-fname" class="error"></div>
        </div>

        <div class="form-group">
          AIUB ID <input type="text" id="sid" name="sid" required pattern="[0-9]{2}-[0-9]{5}-[0-9]"
            placeholder="22-12345-1">
          <div id="err-sid" class="error"></div>
        </div>

        <div class="form-group">
          Mobile <input type="text" id="phone" name="phone" required pattern="[0-9]{11}" placeholder="01XXXXXXXXX">
          <div id="err-phone" class="error"></div>
        </div>


        <div class="form-group">
          Age <input type="number" id="age" name="age" required min="18" max="60">
          <div id="err-age" class="error"></div>
        </div>

        <div class="form-group">
          Blood Group
          <select id="bgroup" name="bgroup" required>
            <option value="">Select blood group</option>
            <option value="A+">A+</option>
            <option value="A-">A-</option>
            <option value="B+">B+</option>
            <option value="B-">B-</option>
            <option value="O+">O+</option>
            <option value="O-">O-</option>
            <option value="AB+">AB+</option>
            <option value="AB-">AB-</option>
          </select>
          <div id="err-bgroup" class="error"></div>
        </div>


        <div class="form-group">
          Donated Before
          <div class="radio-group">
            <input type="radio" id="donated-yes" name="donated" value="Yes" required>
            Yes
            <input type="radio" id="donated-no" name="donated" value="No" required>
            No
          </div>
          <div id="err-donated" class="error"></div>
        </div>


        <div class="form-group">
          <input type="checkbox" id="agree" name="agree" required>
          I am healthy and willing to donate
          <div id="err-agree" class="error"></div>
        </div>

        <div class="form-group">
          Password <input type="password" id="pass" name="pass" required minlength="6">
          <div id="err-pass" class="error"></div>
        </div>

        <div class="form-group">
          Confirm Password<input type="password" id="pass2" name="pass2" required>
          <div id="err-pass2" class="error"></div>
        </div>

        <button type="submit">Register Donor</button>

      </form>

      <p id="count">Total donors: 0</p>

    </div>

  </div>
  <table id="list" style="">
    <thead>
      <tr>
        <th>Name</th>
        <th>ID</th>
        <th>Blood Group</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody>
    </tbody>
  </table>
</body>

</html>
